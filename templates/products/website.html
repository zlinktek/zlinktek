<!-- Generated product content. Edit the shared sources, then regenerate. -->
<style>
body.product-page #main {width:100%;max-width:1140px;padding:0 20px;box-sizing:border-box;}
body.product-page .page {display:flow-root;float:none;width:100%;padding-right:0;}
body.product-page .page__inner-wrap {margin-top:0.75em;}
body.product-page .page__title {margin-bottom:18px;line-height:1.3;}
.product-detail {overflow-wrap:anywhere;min-width:0;}
.product-detail > img {max-width:640px;object-fit:contain;background:#fff;}
.product-detail > img[alt*="尺寸"] {max-width:780px;}
.product-detail > img:first-of-type {max-width:820px;max-height:none;}
.product-detail table {display:table;table-layout:auto;}
.product-detail th:first-child,.product-detail td:first-child {min-width:80px;}
.product-detail h2,.product-detail h3 {scroll-margin-top:24px;}
</style>
<div class="product-detail" style="max-width:1100px;margin:auto;line-height:1.85;">
<div style="background:#020617;color:#e5e7eb;padding:18px 22px;">
<p style="color:#38bdf8;letter-spacing:2px;font-size:14px;margin:0 0 8px;">$brand</p>
<p style="color:#dbeafe;font-size:19px;line-height:1.6;margin:0 0 10px;">$subtitle</p>
<p style="color:#bae6fd;font-size:15px;line-height:1.6;margin:0;">$notice</p>
</div>
$hero
$body
</div>
